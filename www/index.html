<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابع دراسة التوجيهي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF2F4; --surf:#FFFFFF; --ink:#16282F; --mute:#566B73; --line:#D2DDE2;
  --sched:#3553A0; --do:#1B7F65; --avoid:#A33F58; --prim:#0F6C7A; --tech:#6B49A8; --meal:#A66A00; --scr:#B4531A;
  --good:#1B7F65; --bad:#B0431F; --soft:#E4ECEF;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --f-head:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surf:#172830; --ink:#E7EFF2; --mute:#97ABB3; --line:#2B3D45;
    --sched:#93ABF2; --do:#5CCBAA; --avoid:#F092A8; --prim:#62C6D4; --tech:#B79CF0; --meal:#E4B04F; --scr:#F0A070;
    --good:#5CCBAA; --bad:#F3A27A; --soft:#1F323A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surf:#172830; --ink:#E7EFF2; --mute:#97ABB3; --line:#2B3D45;
  --sched:#93ABF2; --do:#5CCBAA; --avoid:#F092A8; --prim:#62C6D4; --tech:#B79CF0; --meal:#E4B04F; --scr:#F0A070;
  --good:#5CCBAA; --bad:#F3A27A; --soft:#1F323A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--prim);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.stat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-inline-end:6px;vertical-align:middle}
.stat-dot.cloud{background:var(--good)} .stat-dot.error{background:var(--bad)}
h1,h2,h3{margin:0;font-weight:700}
.hero{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin-bottom:16px}
.hero .day{font-family:var(--f-head);font-size:38px;line-height:1.15;font-weight:600}
.hero .date{color:var(--mute);font-size:15px;margin-top:2px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.navbtns{display:flex;gap:6px;align-items:center}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surf)}
.ib svg{width:20px;height:20px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;background:var(--surf)}
.pill.on{background:var(--prim);border-color:var(--prim);color:#fff}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px;margin-top:16px}
.meter .lbl{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.meter .track{height:8px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;transition:width .35s ease}
.c-schedule{--c:var(--sched)} .c-do{--c:var(--do)} .c-avoid{--c:var(--avoid)} .c-tech{--c:var(--tech)} .c-meal{--c:var(--meal)} .c-rec{--c:var(--prim)}
.fill{background:var(--c)}
.sec{margin-bottom:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}
.sec-h h2{font-size:18px;display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--c)}
.sec-h .cnt{color:var(--mute);font-size:14px}
.sec-hint{font-size:13px;color:var(--mute);margin:-4px 4px 8px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.row[disabled]{opacity:.55;cursor:not-allowed}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;transition:background .15s}
.box svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .18s}
.row.done .box{background:var(--c)}
.row.done .box svg{opacity:1;transform:scale(1)}
.row.done .txt b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.row.just .box{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.txt{flex:1;min-width:0}
.txt b{font-weight:500;display:block}
.txt small{display:block;color:var(--mute);font-size:13px;line-height:1.45}
.tm{flex:none;font-size:14px;color:var(--c);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.notice{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--mute)}
.empty{padding:16px;text-align:center;color:var(--mute);background:var(--surf);border:1px dashed var(--line);border-radius:14px}
/* week */
.daycard{width:100%;display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start}
.daycard.today{border-color:var(--prim);box-shadow:0 0 0 2px color-mix(in srgb,var(--prim) 25%,transparent)}
.daycard .dn{font-weight:700}
.daycard .dd{font-size:13px;color:var(--mute)}
.mini{display:grid;gap:5px}
.mini .track{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.pct{font-family:var(--f-head);font-size:22px;min-width:52px;text-align:end;font-variant-numeric:tabular-nums}
.pct.na{color:var(--mute);font-size:16px}
.wkbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wkbar .t{font-weight:700}
/* stats */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:10px}
.big{font-family:var(--f-head);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--mute)}
.delta{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin-top:8px}
.delta.up{background:color-mix(in srgb,var(--good) 16%,var(--surf));color:var(--good)}
.delta.down{background:color-mix(in srgb,var(--bad) 16%,var(--surf));color:var(--bad)}
.delta.same{background:var(--soft);color:var(--mute)}
.cmp{display:grid;gap:14px}
.cmp .name{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.cmp .name span:last-child{color:var(--mute);font-size:13px}
.twin{display:grid;gap:4px}
.twin .track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.twin .track.prev .fill{opacity:.35}
.twin .lg{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;padding-top:10px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col .v{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.col .bars{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.col .ghost{position:absolute;bottom:0;width:100%;border:2px dashed var(--mute);border-bottom:0;border-radius:8px 8px 0 0;opacity:.6}
.col .bar{position:relative;width:62%;background:var(--prim);border-radius:8px 8px 0 0;min-height:3px}
.col .nm{font-size:12px;color:var(--mute);white-space:nowrap}
.col.future .bar{background:var(--soft)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--soft);border-radius:12px;padding:12px}
.fact .k{font-size:13px;color:var(--mute)}
.fact .n{font-family:var(--f-head);font-size:26px}
.miss li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.miss li:first-child{border-top:0}
.miss .c{color:var(--mute);font-size:14px;white-space:nowrap}
.sum{font-size:16px;line-height:1.8}
/* edit */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.form{background:var(--surf);border:2px solid var(--prim);border-radius:18px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
.form label{font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--bg)}
.chip.on{background:var(--c,var(--prim));border-color:var(--c,var(--prim));color:#fff}
.btn{border-radius:12px;padding:11px 18px;font-weight:700;min-height:46px}
.btn.p{background:var(--prim);color:#fff}
.btn.g{border:1px solid var(--line);background:var(--surf)}
.btn.wide{width:100%}
.err{color:var(--bad);font-size:14px}
.erow{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.erow .txt b{font-weight:500}
.erow .acts{display:flex;gap:6px;flex:none}
.erow .ib{width:38px;height:38px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;color:#fff;background:var(--c);margin-inline-end:6px}
/* techniques */
details.tg{background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.tg[open]{border-color:var(--prim)}
details.tg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;min-height:56px}
details.tg summary::-webkit-details-marker{display:none}
details.tg summary::after{content:"";margin-inline-start:auto;width:10px;height:10px;border-inline-end:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;flex:none;order:9}
details.tg[open] summary::after{transform:rotate(-135deg)}
.tg .gn{font-weight:700;font-size:17px}
.tg .gw{color:var(--mute);font-size:13px}
.tg .gc{background:var(--soft);color:var(--mute);border-radius:99px;font-size:12px;padding:1px 9px}
.tg .nowtag{background:var(--prim);color:#fff;border-radius:99px;font-size:12px;padding:1px 10px}
.tg ul.list{padding:0 12px 12px}
.tc{background:var(--bg);border-radius:12px;padding:12px 14px}
.tc b{display:block;font-weight:700;margin-bottom:4px}
.tc .tw,.tc .th{font-size:14.5px;line-height:1.6}
.tc .tw span,.tc .th span{color:var(--prim);font-weight:700}
.tc .ts{font-size:12.5px;color:var(--mute);margin-top:6px;direction:rtl}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--mute);font-size:11.5px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--prim);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.hero .day{font-size:32px}.meters{gap:8px}.daycard{grid-template-columns:78px 1fr auto}.big{font-size:46px}}

/* v2 additions */
.sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;padding:6px 4px;text-align:start;min-height:44px}
.sec-h .cnt{margin-inline-start:auto}
.sec-h2{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}
.sec-h2 h2{font-size:18px;display:flex;align-items:center;gap:8px}
.sec-h2 h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--c)}
.sec-h2 .cnt{color:var(--mute);font-size:14px}
.chev{width:9px;height:9px;border-inline-end:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;flex:none;margin-inline-start:6px}
.chev.shut{transform:rotate(-45deg)}
.sub{font-size:14px;font-weight:700;color:var(--c);margin:12px 4px 6px}
.sub span{font-weight:400;color:var(--mute);font-size:13px}
.parts{background:var(--bg);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;margin:-8px 6px 0;padding:14px 10px 10px;display:grid;gap:8px}
.part{display:grid;gap:4px}
.part .pn{font-size:13px;color:var(--mute);font-weight:700}
.part .po{display:flex;flex-wrap:wrap;gap:6px}
.chip.pk{font-size:13.5px;padding:5px 11px;background:var(--surf)}
.chip.pk.on{background:var(--c);border-color:var(--c);color:#fff}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:color-mix(in srgb,var(--prim) 14%,var(--surf));border:1px solid var(--prim);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.card.msg{border-width:2px}
.card.msg.good{border-color:var(--good)}
.card.msg.steady{border-color:var(--prim)}
.card.msg.down{border-color:var(--avoid)}
.card.msg .sum{margin:0 0 8px}
.boost{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:6px}
.boost ul{margin:6px 0 0;padding-inline-start:20px}
.boost li{margin:3px 0}
details.stage .row{margin:0}
.donetag{background:var(--good);color:#fff;border-radius:99px;font-size:12px;padding:1px 10px}
.card.help{border-color:var(--avoid)}
textarea.inp{resize:vertical;min-height:120px;line-height:1.6}
select.inp{appearance:auto}
.hero .track{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.c-screen{--c:var(--scr)}
.nowc{background:var(--surf);border:2px solid var(--sched);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.nowc .k{font-size:13px;color:var(--sched);font-weight:700}
.nowc .nx{font-size:13.5px;color:var(--mute);margin-top:8px}
.jump{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.jump .pill{white-space:nowrap;flex:none}
.wl{display:inline-block;margin:4px 0 0 6px;padding:5px 12px;border-radius:999px;border:1px solid var(--prim);color:var(--prim);text-decoration:none;font-size:14px}
.watch{margin:0 16px 8px;font-size:14px}
.prog{margin:4px 6px 0;font-size:14px}
.prog summary{cursor:pointer;color:var(--prim);padding:6px 4px}
.prog ul{margin:0;padding-inline-start:18px}
.prog li{margin:3px 0}
.prog b{font-variant-numeric:tabular-nums;color:var(--sched);margin-inline-end:8px}
.nowc ul.list{margin-top:4px}
@media (min-width:1000px){
body{padding-inline-end:190px}
.wrap{width:100%;max-width:1180px;padding:24px 32px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
.wrap>*{grid-column:1/-1;min-width:0}
.wrap>section.sec{grid-column:auto}
nav.tabs{top:0;bottom:0;inset-inline-start:auto;inset-inline-end:0;left:auto;right:0;width:190px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:6px;padding:24px 12px;border-top:0;border-inline-start:1px solid var(--line)}
nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:10px 14px}
nav.tabs button.on{background:var(--soft)}
.hero .day{font-size:44px}
.row,.erow{transition:background .12s}
.row:hover:not([disabled]){background:var(--soft)}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="التنقل"></nav>
<script>
(function(){
"use strict";
var LS="tawjihi-tracker-v1";
var VER=5;
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var CATS={
  schedule:{name:"الجدول",edit:"جدول",hint:"مرتّب بالوقت. اضغط على الدائرة لما تخلص. اللي عليه ⭐ هو وقت دراسة أساسي، وهدف الدراسة بتلاقيه آخر القائمة."},
  meal:{name:"الوجبات",edit:"وجبة",hint:"الهدف: 5 حصص فاكهة وخضار باليوم على الأقل، مع سكر وملح أقل. اضغط على الخيارات اللي أخذتها، وبعدين أشّر على الوجبة."},
  screen:{name:"التقنية",edit:"تقنية",hint:"الكمبيوتر: 5 فيديوهات ترفيه توزعهم متى بدك، و3 فيديوهات تعليمية. التلفون بأوقات محددة بس."},
  "do":{name:"لازم أسوّي",edit:"أسوّي",hint:"أشياء لازم تسويها خلال اليوم بأي وقت. أشّر لما تخلص."},
  tech:{name:"تكنيكات",edit:"تكنيك",hint:"تكنيكات الدراسة والتركيز مقسّمة حسب وقتها. أشّر لما تطبّقها."},
  avoid:{name:"لازم أتجنب",edit:"أتجنب",hint:"أشياء تأشّر عليها لما تتجنبها طول اليوم"}
};
var CKEYS=["schedule","meal","do","screen","tech","avoid"];
var TG=[
  {id:"am",name:"الصباح",when:"فور الاستيقاظ",from:5,to:10},
  {id:"pre",name:"قبل الجلسة",when:"قبل ما تبدأ الدراسة",from:10,to:15},
  {id:"during",name:"أثناء الجلسة",when:"وأنت عم تدرس",from:15,to:19},
  {id:"after",name:"بعد الحصة وبعد الجلسة",when:"نفس اليوم",from:19,to:21},
  {id:"night",name:"آخر اليوم وقبل النوم",when:"من 20:30 تقريباً",from:21,to:5},
  {id:"weekly",name:"كل أسبوع",when:"مرة بالأسبوع"},
  {id:"exam",name:"قبل الامتحان",when:"يوم الامتحان وما قبله"},
  {id:"long",name:"على المدى الطويل",when:"طول السنة"}
];

/* ---------- techniques (guide + tasks) ---------- */
var NOFRI=[0,1,2,3,4,6],DUTY=[0,1,3],TUE=[2],THU=[4],FRI=[5],SAT=[6],ALL=[0,1,2,3,4,5,6];
var TECH=[
 {g:"am",t:"التعرض للضوء الطبيعي",w:"لضبط الساعة البيولوجية",h:"افتح الستارة أو اطلع للشمس بعد الاستيقاظ مباشرة",s:"Roenneberg et al. (2004)",nt:1},
 {g:"am",t:"فطور متوازن مع ماء",w:"لتحسين الانتباه والذاكرة وتجنب الجفاف",h:"بروتين + خبز كامل + فاكهة، وكاسة ماء",s:"Adolphus et al. (2013)؛ Armstrong et al. (2012)",nt:1},

function newSeeds(cf){
  var t=[];
  TECH.forEach(function(x,i){
    if(x.nt)return;
    t.push({id:"k3"+i,cat:"tech",grp:x.g,title:x.t,days:(x.d||ALL).slice(),time:"",note:x.h,createdFrom:cf});
  });
  MEALS.forEach(function(m){
    t.push({id:m.id,cat:"meal",title:m.title,days:ALL.slice(),time:m.time,note:m.note,parts:JSON.parse(JSON.stringify(m.parts)),createdFrom:cf});
  });
  return t;
}

function startEdit(id,cat){
  if(id){
    var t=S.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
    S.edit={id:id,cat:t.cat,title:t.title,days:t.days.slice(),time:t.time||"",note:t.note||"",grp:t.grp||"am",partsText:partsToText(t.parts)};
  }else{
    S.edit={id:null,cat:cat&&cat!=="all"?cat:"do",title:"",days:ALL.slice(),time:"",note:"",grp:"am",partsText:""};
  }
  S.editErr="";S.tview="mine";S.tab="tasks";render();
  setTimeout(function(){var f=document.getElementById("f-title");if(f)f.focus();},30);
}
function saveEdit(){
  var e=S.edit;if(!e)return;
  e.title=e.title.trim();
  if(!e.title){S.editErr="اكتب اسم المهمة";render();return;}
  if(!e.days.length){S.editErr="اختر يوماً واحداً على الأقل";render();return;}
  var days=e.days.slice().sort(),timed=(e.cat==="schedule"||e.cat==="meal");
  var parts=e.cat==="meal"?textToParts(e.partsText):null;
  if(e.id){
    S.tasks.forEach(function(t){if(t.id===e.id){
      t.title=e.title;t.cat=e.cat;t.days=days;t.time=timed?e.time:"";t.note=e.note.trim();
      if(e.cat==="tech")t.grp=e.grp;else delete t.grp;
      if(parts)t.parts=parts;else delete t.parts;
    }});
  }else{
    var nt={id:newId(),cat:e.cat,title:e.title,days:days,time:timed?e.time:"",note:e.note.trim(),createdFrom:today()};
    if(e.cat==="tech")nt.grp=e.grp;
    if(parts)nt.parts=parts;
    S.tasks.push(nt);
  }
  S.edit=null;S.editErr="";queue();render();
}
function archive(id){
  S.tasks.forEach(function(t){if(t.id===id){t.archivedFrom=today();}});
  if(S.edit&&S.edit.id===id)S.edit=null;
  queue();render();
}
function restore(id){
  S.tasks.forEach(function(t){
    if(t.id===id&&t.archivedFrom){t.gaps=(t.gaps||[]).concat([[t.archivedFrom,today()]]);delete t.archivedFrom;}
  });
  queue();render();
}

function mm(t){var p=t.split(":");return +p[0]*60+ +p[1];}
function inGrp(g,hr){return g.from!=null&&(g.from<g.to?(hr>=g.from&&hr<g.to):(hr>=g.from||hr<g.to));}
function guideCard(){
  if(S.set.seenGuide)return "";
  return '<div class="notice" style="border:1px solid var(--prim);color:var(--ink)"><b>كيف تستعمل التطبيق (30 ثانية)</b><ol style="margin:6px 0;padding-inline-start:20px"><li>كرت «هسا» تحت بيقلك شو تسوي بهالوقت بالضبط. اضغط على الدائرة لما تخلص.</li><li>باقي المهام مطوية بأقسام. اضغط على اسم القسم اللي بدك إياه.</li><li>ساعات الدراسة اللي عليها ⭐ ثابتة، والباقي بتوزعه انت لحد ما توصل هدف الدراسة.</li></ol><button class="pill on" data-a="seen">فهمت</button></div>';
}
function nowPanel(ds){
  if(ds!==today())return "";
  var n=new Date(),nm=n.getHours()*60+n.getMinutes(),cur=null,nx=null,out="";
  var sch=tasksFor(ds,"schedule");
  sch.forEach(function(t){if(!t.time)return;if(mm(t.time)<=nm)cur=t;else if(!nx)nx=t;});
  function blk(title,list){if(!list.length)return;out+='<div class="sub" style="margin-top:10px">'+title+'</div><ul class="list">'+list.map(function(t){return rowHtml(t,ds,false);}).join("")+'</ul>';}
  blk("الجدول",cur?[cur]:[]);
  blk("وجبة قريبة",tasksFor(ds,"meal").filter(function(t){return t.time&&!isDone(ds,t.id)&&Math.abs(mm(t.time)-nm)<=90;}).slice(0,1));
  var g=TG.filter(function(x){return inGrp(x,n.getHours());})[0];
  blk("تكنيك لهالوقت",g?tasksFor(ds,"tech").filter(function(t){return t.grp===g.id&&!isDone(ds,t.id);}).slice(0,2):[]);
  var goal=sch.filter(function(t){return t.goal;})[0],free=sch.filter(function(t){return t.free&&!isDone(ds,t.id);})[0];
  if(goal)blk(esc(goal.title),free?[free]:[goal]);
  if(!out)out='<div class="nx">ما في شي عاجل هسا. افتح الأقسام تحت.</div>';
  if(nx)out+='<div class="nx">التالي: '+esc(nx.time)+' · '+esc(nx.title)+'</div>';
  return '<div class="nowc c-schedule"><div class="k">هسا · '+pad(n.getHours())+':'+pad(n.getMinutes())+'</div>'+out+'</div>';
}
function progHtml(ds){
  var l=tasksFor(ds,"schedule");if(!l.length)return "";
  return '<details class="prog"><summary>برنامج اليوم</summary><ul>'+l.map(function(t){return '<li><b>'+(t.time?esc(t.time):'•')+'</b>'+esc(t.title)+'</li>';}).join("")+'</ul></details>';
}

function partsHtml(t,ds,locked){
  if(!t.parts||!t.parts.length)return "";
  var sel=(S.picks[ds]&&S.picks[ds][t.id])||[];
  return '<div class="parts">'+t.parts.map(function(p){
    return '<div class="part"><span class="pn">'+esc(p.n)+'</span><span class="po">'+p.o.map(function(o){
      var on=sel.indexOf(o)>=0;
      return '<button type="button" class="chip pk'+(on?" on":"")+'" data-a="pick" data-id="'+t.id+'" data-l="'+esc(o)+'"'+(locked?" disabled":"")+' aria-pressed="'+on+'">'+esc(o)+'</button>';
    }).join("")+'</span></div>';
  }).join("")+'</div>';
}
function rowHtml(t,ds,locked){
  var d=isDone(ds,t.id);
  return '<li class="c-'+t.cat+'"><button class="row'+(d?" done":"")+(S.just===t.id?" just":"")+'" data-a="tog" data-id="'+t.id+'"'+(locked?" disabled":"")+' aria-pressed="'+d+'">'+
    '<span class="box">'+I.check+'</span>'+
    '<span class="txt"><b>'+esc(t.title)+'</b>'+(t.note?'<small>'+esc(t.note)+'</small>':'')+'</span>'+
    (t.time?'<span class="tm">'+esc(t.time)+'</span>':'')+'</button>'+(t.cat==="meal"?partsHtml(t,ds,locked):"")+'</li>';
}
function sectionHtml(c,ds,future,st){
  var l=tasksFor(ds,c),coll=!!S.coll[c];
  var h='<section class="sec c-'+c+'" id="sec-'+c+'"><button class="sec-h" data-a="sec" data-c="'+c+'" aria-expanded="'+(!coll)+'"><h2>'+CATS[c].name+'</h2><span class="cnt">'+st[c].d+' من '+st[c].t+'</span><i class="chev'+(coll?" shut":"")+'"></i></button>';
  if(!coll){
    if(CATS[c].hint)h+='<div class="sec-hint">'+CATS[c].hint+'</div>';
    if(!l.length)h+='<div class="empty">ما في مهام بهذا القسم لهذا اليوم</div>';
    else if(c==="tech"){
      TG.concat([{id:"",name:"أخرى"}]).forEach(function(g){
        var gl=l.filter(function(t){return (t.grp||"")===g.id||(g.id===""&&!TG.some(function(x){return x.id===t.grp;}));});
        if(g.id===""&&!gl.length)return;
        if(!gl.length)return;
        h+='<div class="sub">'+g.name+(g.when?' <span>'+g.when+'</span>':'')+'</div><ul class="list">'+gl.map(function(t){return rowHtml(t,ds,future);}).join("")+'</ul>';
      });
    }else h+='<ul class="list">'+l.map(function(t){return rowHtml(t,ds,future);}).join("")+'</ul>';
  }

}

/* ---------- views: stats ---------- */
function weekStats(ws,upTo){
  var out={all:{d:0,t:0},days:[]};
  CKEYS.forEach(function(c){out[c]={d:0,t:0};});
  for(var i=0;i<7;i++){
    if(i>upTo){out.days.push(null);continue;}
    var st=dayStat(ymd(addDays(ws,i)));out.days.push(st);
    out.all.d+=st.all.d;out.all.t+=st.all.t;
    CKEYS.forEach(function(c){out[c].d+=st[c].d;out[c].t+=st[c].t;});
  }
  return out;
}
function deltaHtml(a,b){
  if(a==null||b==null)return '<span class="delta same">ما في أسبوع سابق للمقارنة</span>';
  var pp=Math.round((a-b)*100);
  if(pp>0)return '<span class="delta up">▲ +'+pp+' نقطة عن الأسبوع الماضي</span>';
  if(pp<0)return '<span class="delta down">▼ '+Math.abs(pp)+' نقطة أقل من الأسبوع الماضي</span>';
  return '<span class="delta same">= نفس الأسبوع الماضي</span>';
}
function pickN(arr,n,seed){var out=[],i=seed%arr.length;while(out.length<n&&out.length<arr.length){out.push(arr[i%arr.length]);i+=1;}return out;}
function msgCard(pa,pb,miss,upTo,sw){
  if(!S.set.weeklyMsg){
    return '<div class="card"><h3>رسالة نهاية الأسبوع</h3><p class="sum" style="margin:0 0 10px">الرسالة متوقفة. لما تفعّلها، بقارن أسبوعك مع اللي قبله وبكتبلك رسالة تناسب نتيجتك.</p><button class="btn p" data-a="togmsg">فعّل الرسالة الأسبوعية</button></div>';
  }
  var seed=0;sw.split("").forEach(function(c){seed+=c.charCodeAt(0);});
  var pp=(pa!=null&&pb!=null)?Math.round((pa-pb)*100):null;
  var type,lines;
  if(pa==null){type="steady";lines=["لسا ما في بيانات كفاية لهالأسبوع. أشّر على أول مهمة وابدأ من هناك."];}
  else if(pp==null){type="good";lines=["هذا أول أسبوع بنقيّمه، وبداية جيدة. الأسبوع الجاي بنقارن."].concat(pa>=0.7?["نسبتك "+Math.round(pa*100)+"% وهذا أساس قوي."]:[]);}
  else if(pp>=3){type="good";lines=pickN(MSG_GOOD,2,seed);}
  else if(pp<=-3){type="down";lines=pickN(MSG_DOWN,2,seed);}
  else {type="steady";lines=pa>=0.8?[MSG_STEADY[0],"ونسبتك العالية "+Math.round(pa*100)+"% تستاهل التقدير."]:pickN(MSG_STEADY,1,seed);}
  var h='<div class="card msg '+type+'"><h3>رسالة نهاية الأسبوع</h3>'+
    (upTo<6?'<div class="sec-hint" style="margin:0 0 8px">تقييم مؤقت لحد اليوم، والرسالة النهائية بتكون بعد السبت.</div>':'')+
    lines.map(function(l){return '<p class="sum">'+esc(l)+'</p>';}).join("");
  if(type==="down"){
    h+='<div class="boost"><b>أشياء ترفع معنوياتك هسا:</b><ul>'+pickN(BOOST,5,seed).map(function(b){return '<li>'+esc(b)+'</li>';}).join("")+'</ul>';
    h+='<p class="sec-hint" style="margin:8px 0 0">وإذا حاسس بحزن أو ضغط أكبر من العادة لأكثر من أسبوعين، احكي مع أهلك أو مرشد المدرسة. هذا مش ضعف.</p></div>';
  }
  if(miss.length&&type!=="good"){
    h+='<p class="sum" style="margin-top:10px"><b>ركّز الأسبوع الجاي على:</b> '+miss.slice(0,2).map(function(m){return esc(m.t.title);}).join("، و")+'. وخلّيها خطوة صغيرة.</p>';
  }
  h+='<button class="pill" data-a="togmsg" style="margin-top:10px">إيقاف الرسالة الأسبوعية</button></div>';
  return h;
}
function statsView(){
  var curW=ymd(wkStart(new Date()));
  var ws=parse(S.sw),pw=addDays(ws,-7);
  var upTo=S.sw===curW?new Date().getDay():6;
  var cur=weekStats(ws,upTo),prev=weekStats(pw,upTo);
  var h='<div class="wkbar"><button class="ib" data-a="swprev" aria-label="الأسبوع السابق">'+I.prev+'</button>'+
    '<div class="t">'+shortDate(S.sw)+' - '+shortDate(ymd(addDays(ws,6)))+(S.sw===curW?' (هذا الأسبوع)':'')+'</div>'+
    '<button class="ib" data-a="swnext" aria-label="الأسبوع التالي"'+(S.sw>=curW?" disabled":"")+'>'+I.next+'</button></div>';
  var pa=pc(cur.all),pb=pc(prev.all);
  var miss=[];
  S.tasks.forEach(function(t){
    var sc=0,dn=0;
    for(var i=0;i<=upTo;i++){var ds=ymd(addDays(ws,i));if(applies(t,ds)){sc++;if(isDone(ds,t.id))dn++;}}
    if(sc>0&&dn<sc)miss.push({t:t,sc:sc,dn:dn,gap:sc-dn});
  });
  miss.sort(function(a,b){return b.gap-a.gap||a.dn/a.sc-b.dn/b.sc;});
  h+='<div class="card"><h3>إنجازك العام</h3><div class="big">'+(pa==null?"—":Math.round(pa*100)+'<small>%</small>')+'</div>'+deltaHtml(pa,pb);
  h+='<div class="sec-hint" style="margin:10px 0 0">'+(upTo<6?'المقارنة مع نفس الأيام من الأسبوع الماضي ('+DAYS[0]+' حتى '+DAYS[upTo]+'). ':'')+cur.all.d+' مهمة منجزة من '+cur.all.t+'.</div></div>';
  h+=msgCard(pa,pb,miss,upTo,S.sw);
  h+='<div class="card"><h3>حسب القسم</h3><div class="cmp">';
  CKEYS.forEach(function(c){
    var a=pc(cur[c]),b=pc(prev[c]);
    h+='<div class="c-'+c+'"><div class="name"><span>'+CATS[c].name+'</span><span>'+cur[c].d+'/'+cur[c].t+'</span></div><div class="twin">'+
      '<div class="track"><div class="fill" style="width:'+(a==null?0:Math.round(a*100))+'%;height:100%"></div></div>'+
      '<div class="lg"><span>هذا الأسبوع: '+(a==null?"—":Math.round(a*100)+"%")+'</span></div>'+
      '<div class="track prev"><div class="fill" style="width:'+(b==null?0:Math.round(b*100))+'%;height:100%"></div></div>'+
      '<div class="lg"><span>الأسبوع الماضي: '+(b==null?"—":Math.round(b*100)+"%")+'</span></div></div></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><h3>كل يوم</h3><div class="chart">';
  for(var i=0;i<7;i++){
    var c=cur.days[i],p=prev.days[i],cp=c?pc(c.all):null,pp=p?pc(p.all):null;
    h+='<div class="col'+(c?"":" future")+'"><span class="v">'+(cp==null?"":Math.round(cp*100))+'</span><div class="bars">'+
      (pp!=null?'<div class="ghost" style="height:'+Math.round(pp*100)+'%"></div>':'')+
      '<div class="bar" style="height:'+(cp==null?3:Math.max(3,Math.round(cp*100)))+'%"></div></div><span class="nm">'+DAYS[i].replace("ال","")+'</span></div>';
  }
  h+='</div><div class="legend"><span><i style="background:var(--prim)"></i>هذا الأسبوع</span><span><i style="border:2px dashed var(--mute)"></i>الأسبوع الماضي</span></div></div>';
  var best=-1,bi=-1;
  cur.days.forEach(function(d,i){if(d){var p=pc(d.all);if(p!=null&&p>best){best=p;bi=i;}}});
  var streak=0,k=0;
  var tp=pc(dayStat(today()).all);if(tp==null||tp<0.7)k=1;
  for(;k<90;k++){var q=pc(dayStat(ymd(addDays(new Date(),-k))).all);if(q!=null&&q>=0.7)streak++;else break;}
  h+='<div class="card"><h3>ملخص سريع</h3><div class="facts"><div class="fact"><div class="k">أفضل يوم</div><div class="n">'+(bi<0?"—":DAYS[bi]+" "+Math.round(best*100)+"%")+'</div></div>'+
    '<div class="fact"><div class="k">أيام متتالية فوق 70%</div><div class="n">'+streak+'</div></div></div></div>';
  h+='<div class="card"><h3>أكثر مهام فاتتك</h3>';
  if(!miss.length)h+='<div class="empty">ما في مهام فاتتك هذا الأسبوع</div>';
  else h+='<ul class="list miss" style="gap:0">'+miss.slice(0,6).map(function(m){return '<li class="c-'+m.t.cat+'"><span><span class="tag">'+CATS[m.t.cat].edit+'</span>'+esc(m.t.title)+'</span><span class="c">'+m.dn+' من '+m.sc+'</span></li>';}).join("")+'</ul>';
  h+='</div>';
  return h;
}

/* ---------- views: tasks / guide ---------- */
function daysLabel(d){
  if(d.length===7)return "كل يوم";
  if(d.slice().sort().join()==="0,1,3")return "أيام الدوام";
  return d.slice().sort().map(function(i){return DAYS[i].replace("ال","");}).join("، ");
}
function formHtml(){
  var e=S.edit,timed=(e.cat==="schedule"||e.cat==="meal");
  return '<div class="form c-'+e.cat+'"><h3>'+(e.id?"تعديل المهمة":"مهمة جديدة")+'</h3>'+
    '<div><label for="f-title">اسم المهمة</label><input class="inp" id="f-title" data-f="title" value="'+esc(e.title)+'" maxlength="120" autocomplete="off"></div>'+
    '<div><label>القسم</label><div class="chips">'+CKEYS.map(function(c){return '<button type="button" class="chip c-'+c+(e.cat===c?" on":"")+'" data-a="fcat" data-c="'+c+'">'+CATS[c].name+'</button>';}).join("")+'</div></div>'+
    '<div><label>الأيام</label><div class="chips">'+DAYS.map(function(n,i){return '<button type="button" class="chip'+(e.days.indexOf(i)>=0?" on":"")+'" data-a="fday" data-i="'+i+'">'+n.replace("ال","")+'</button>';}).join("")+'</div>'+
    '<div style="margin-top:6px"><button type="button" class="pill" data-a="fall">كل الأيام</button> <button type="button" class="pill" data-a="fduty">أيام الدوام</button></div></div>'+
    (timed?'<div><label for="f-time">الوقت (اختياري)</label><input class="inp" id="f-time" type="time" data-f="time" value="'+esc(e.time)+'" style="max-width:180px"></div>':'')+
    (e.cat==="tech"?'<div><label for="f-grp">وقت التكنيك</label><select class="inp" id="f-grp" data-f="grp">'+TG.map(function(g){return '<option value="'+g.id+'"'+(e.grp===g.id?" selected":"")+'>'+g.name+'</option>';}).join("")+'</select></div>':'')+
    (e.cat==="meal"?'<div><label for="f-parts">مكوّنات الوجبة وخياراتها (سطر لكل مكوّن، الصيغة: اسم المكوّن: خيار، خيار)</label><textarea class="inp" id="f-parts" data-f="partsText" rows="6">'+esc(e.partsText)+'</textarea></div>':'')+
    '<div><label for="f-note">ملاحظة (اختياري)</label><input class="inp" id="f-note" data-f="note" value="'+esc(e.note)+'" maxlength="160" autocomplete="off"></div>'+
    (S.editErr?'<div class="err" role="alert">'+esc(S.editErr)+'</div>':'')+
    '<div style="display:flex;gap:8px"><button class="btn p" data-a="fsave">حفظ</button><button class="btn g" data-a="fcancel">إلغاء</button></div></div>';
}
function mineView(){
  var h='';
  if(S.edit)h+=formHtml();
  else h+='<button class="btn p wide" data-a="fnew" style="margin-bottom:14px">+ إضافة مهمة</button>';
  var fl=[["all","الكل"]].concat(CKEYS.map(function(c){return [c,CATS[c].edit==="جدول"?"الجدول":CATS[c].name];}));
  h+='<div class="seg">'+fl.map(function(x){return '<button class="pill'+(S.filter===x[0]?" on":"")+'" data-a="filt" data-c="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>';
  var act=S.tasks.filter(function(t){return !t.archivedFrom&&(S.filter==="all"||t.cat===S.filter);});
  var arc=S.tasks.filter(function(t){return t.archivedFrom&&!t.hid&&(S.filter==="all"||t.cat===S.filter);});
  CKEYS.forEach(function(c){
    var l=act.filter(function(t){return t.cat===c;});
    if(!l.length)return;
    h+='<section class="sec c-'+c+'"><div class="sec-h2"><h2>'+CATS[c].name+'</h2><span class="cnt">'+l.length+' مهمة</span></div><ul class="list">';
    l.forEach(function(t){
      h+='<li><div class="erow c-'+c+'"><div class="txt"><b>'+esc(t.title)+'</b><small>'+daysLabel(t.days)+(t.time?' · '+esc(t.time):'')+'</small></div>'+
        '<div class="acts"><button class="ib" data-a="fedit" data-id="'+t.id+'" aria-label="تعديل">'+I.edit+'</button><button class="ib" data-a="farc" data-id="'+t.id+'" aria-label="أرشفة">'+I.trash+'</button></div></div></li>';
    });
    h+='</ul></section>';
  });
  if(!act.length)h+='<div class="empty">ما في مهام بهذا القسم</div>';
  if(arc.length){
    h+='<section class="sec"><div class="sec-h2"><h2 style="font-size:16px">مهام مؤرشفة</h2><span class="cnt">'+arc.length+'</span></div><div class="sec-hint">ما بتنحسب بالإحصائيات من يوم الأرشفة. سجل أيامها السابقة محفوظ.</div><ul class="list">';
    arc.forEach(function(t){
      h+='<li><div class="erow c-'+t.cat+'" style="opacity:.8"><div class="txt"><b>'+esc(t.title)+'</b><small>'+CATS[t.cat].edit+' · أُرشفت '+fmtDate(t.archivedFrom)+'</small></div><div class="acts"><button class="ib" data-a="frest" data-id="'+t.id+'" aria-label="استعادة">'+I.undo+'</button></div></div></li>';
    });
    h+='</ul></section>';
  }
  h+='<div class="card" style="margin-top:16px"><h3>الرسالة الأسبوعية</h3><p class="sum" style="margin:0 0 10px">بقارن أسبوعك مع اللي قبله وبكتبلك رسالة تشجيع، ولو كانت النتيجة أقل بكتبلك أشياء ترفع معنوياتك.</p><button class="btn '+(S.set.weeklyMsg?"g":"p")+'" data-a="togmsg">'+(S.set.weeklyMsg?"مفعّلة، اضغط للإيقاف":"متوقفة، اضغط للتفعيل")+'</button></div>';
  return h;
}
function guideView(){
  var hr=new Date().getHours();
  var h='<div class="notice">دليل التكنيكات مقسّم حسب وقت الاستخدام. التكنيكات اللي ما تكررت بقسم ثاني موجودة كمهام بقسم «تكنيكات» باليوم. المصادر مكتوبة من الذاكرة ولم أتحقق منها بالبحث، فتأكد منها في Google Scholar. القسم المفتوح هو الأنسب لوقتك الآن.</div>';
  TG.forEach(function(g){
    var items=TECH.filter(function(x){return x.g===g.id;});
    var now=g.from!=null&&(g.from<g.to?(hr>=g.from&&hr<g.to):(hr>=g.from||hr<g.to));
    h+='<details class="tg"'+(now?' open':'')+'><summary><span class="gn">'+g.name+'</span><span class="gw">'+g.when+'</span>'+(now?'<span class="nowtag">الآن</span>':'')+'<span class="gc">'+items.length+'</span></summary><ul class="list">';
    items.forEach(function(x){
      h+='<li class="tc"><b>'+esc(x.t)+'</b><div class="tw"><span>لأيش:</span> '+esc(x.w)+'</div><div class="th"><span>كيف:</span> '+esc(x.h)+'</div><div class="ts">المصدر: '+esc(x.s)+(x.nt?' · موجودة بقسم آخر':'')+'</div></li>';
    });
    h+='</ul></details>';
  });
  return h;
}
function tasksView(){
  return '<div class="seg"><button class="pill'+(S.tview==="mine"?" on":"")+'" data-a="tv" data-v="mine">مهامي</button><button class="pill'+(S.tview==="guide"?" on":"")+'" data-a="tv" data-v="guide">دليل التكنيكات</button></div>'+(S.tview==="guide"?guideView():mineView());
}

/* ---------- views: recovery ---------- */
function stageInfo(plan){
  var cur=-1,stages=plan.stages.map(function(st,i){
    var d=st.steps.filter(function(_,j){return S.recov[st.id+"-"+j];}).length;
    return {st:st,d:d,t:st.steps.length,full:d===st.steps.length};
  });
  for(var i=0;i<stages.length;i++){if(!stages[i].full){cur=i;break;}}
  return {list:stages,cur:cur};
}
function recovView(){
  var plan=RECOV.gap,info=stageInfo(plan);
  var tot=0,dn=0;info.list.forEach(function(s){tot+=s.t;dn+=s.d;});
  var h='<div class="hero"><div class="day" style="font-size:30px">الأساسيات والثقة</div><div class="date">'+dn+' من '+tot+' خطوة</div>'+
    '<div class="track" style="margin-top:12px"><div class="fill" style="width:'+(tot?Math.round(dn/tot*100):0)+'%;background:var(--prim);height:100%"></div></div></div>';
  h+='<div class="notice">'+esc(plan.intro)+'</div>'+GAPC;
  info.list.forEach(function(x,i){
    var st=x.st,isCur=i===info.cur;
    var open=S.ropen[st.id]!=null?S.ropen[st.id]:isCur;
    h+='<details class="tg stage c-rec" data-sid="'+st.id+'"'+(open?" open":"")+'><summary><span class="gn">'+esc(st.name)+'</span><span class="gw">'+esc(st.wk)+'</span>'+
      (isCur?'<span class="nowtag">الحالية</span>':x.full?'<span class="donetag">خلصت</span>':'')+'<span class="gc">'+x.d+'/'+x.t+'</span></summary>'+
      '<div class="sec-hint" style="margin:0 16px 8px">'+esc(st.goal)+'</div>'+watchHtml(st)+'<ul class="list" style="padding:0 12px 12px">';
    st.steps.forEach(function(s,j){
      var id=st.id+"-"+j,d=!!S.recov[id];
      h+='<li class="c-rec"><button class="row'+(d?" done":"")+'" data-a="rstep" data-id="'+id+'" aria-pressed="'+d+'"><span class="box">'+I.check+'</span><span class="txt"><b>'+esc(s)+'</b></span></button></li>';
    });
    h+='</ul></details>';
  });
  h+='<div class="card help"><h3>متى تطلب مساعدة؟</h3><p class="sum" style="margin:0 0 8px">كلّم أهلك أو مرشد المدرسة أو طبيب إذا لاحظت:</p><ul style="margin:0;padding-inline-start:20px">'+HELP.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
    '<p class="sum" style="margin:10px 0 0"><b>إذا خطرت لك أفكار لإيذاء نفسك:</b> قول لشخص قريب منك الآن، أو توجه لأقرب مستشفى أو جهة طوارئ. طلب المساعدة قوة.</p></div>';
  return h;
}

function exView(){
  var rows=[[0,"06:10","مشي سريع أو جولة تمارين (حسب أسبوعك)"],[1,"06:10","مشي سريع أو جولة تمارين (حسب أسبوعك)"],[2,"06:45","مشي سريع أو جولة تمارين (حسب أسبوعك)"],[3,"06:10","مشي سريع أو جولة تمارين (حسب أسبوعك)"],[4,"07:15","30 دقيقة مشي أو جري خفيف"],[5,"","راحة كاملة (أو كورة مع الأصحاب إذا بدك)"],[6,"18:00","مشي خفيف 20 دقيقة"]];
  var h='<div class="hero"><div class="day" style="font-size:30px">جدول التمارين</div><div class="date">بيبني تدريجياً وما بهلك. الصبح أحسن إلك.</div></div>';
  h+='<div class="card"><h3>جدول الأسبوع</h3><ul class="list miss" style="gap:0">'+rows.map(function(r){return '<li><span><b>'+DAYS[r[0]]+'</b> '+esc(r[2])+'</span><span class="c">'+(r[1]||"—")+'</span></li>';}).join("")+'</ul></div>';
  h+='<div class="card"><h3>كم تتمرن حسب أسبوعك</h3><ul style="margin:0;padding-inline-start:20px"><li><b>أسبوع 1-2:</b> مشي سريع 15 دقيقة + تمدد 5 دقائق.</li><li><b>أسبوع 3-4:</b> جولة تمارين وزن الجسم، حوالي 20 دقيقة.</li><li><b>من أسبوع 5:</b> 25-30 دقيقة: جولتين أو 3، أو جري خفيف متقطع.</li></ul></div>';
  h+='<div class="card"><h3>الجولة</h3><ul style="margin:0;padding-inline-start:20px"><li>10 سكوات</li><li>8 ضغط (ع الركبتين إذا صعب)</li><li>20 ثانية بلانك</li><li>10 طعنات لكل رجل</li></ul><p class="sum" style="margin:8px 0 0">ابدأ بجولة وحدة، وزد جولة كل أسبوعين.</p></div>';
  h+='<div class="card"><h3>قواعد بسيطة</h3><ul style="margin:0;padding-inline-start:20px"><li>سخّن 3 دقائق قبل، واشرب ماء بعد.</li><li>إذا تعبان أو مريض أو نمت قليل: امشِ بس.</li><li>زد الحمل شوي كل أسبوع، مش مرة وحدة.</li><li>إذا حسيت بألم مستمر أو دوخة، وقّف واسأل طبيب.</li><li>الجمعة راحة بدون ذنب. الاستمرار أهم من الشدة.</li></ul></div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById("app");
  var v={today:todayView,week:weekView,stats:statsView,tasks:tasksView,rec:recovView,ex:exView}[S.tab]();
  app.innerHTML='<div class="topline"><span>متابع دراسة التوجيهي</span><span id="stat">'+statusHtml()+'</span></div>'+v;
  var tabs=[["today","اليوم",I.today],["week","الأسبوع",I.week],["ex","التمارين",I.ex],["stats","الإحصائيات",I.stats],["tasks","المهام",I.tasks],["rec","الأساسيات",I.rec]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[2]+'<span>'+t[1]+'</span></button>';}).join("");
  S.just=null;
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-a");
  switch(a){
    case "tab":S.tab=b.getAttribute("data-t");if(S.tab==="stats")S.sw=ymd(wkStart(new Date()));window.scrollTo(0,0);render();break;
    case "tog":toggle(S.sel,b.getAttribute("data-id"));break;
    case "pick":pickOpt(S.sel,b.getAttribute("data-id"),b.getAttribute("data-l"));break;
    case "sec":var c=b.getAttribute("data-c");S.coll[c]=!S.coll[c];render();break;
    case "dayprev":S.sel=ymd(addDays(parse(S.sel),-1));render();break;
    case "daynext":if(S.sel<today()){S.sel=ymd(addDays(parse(S.sel),1));render();}break;
    case "gotoday":S.sel=today();render();break;
    case "goday":S.sel=b.getAttribute("data-d");S.tab="today";window.scrollTo(0,0);render();break;
    case "gostats":S.sw=b.getAttribute("data-w");S.tab="stats";window.scrollTo(0,0);render();break;
    case "wkprev":S.weekView=ymd(addDays(parse(S.weekView),-7));render();break;
    case "wknext":if(S.weekView<ymd(wkStart(new Date()))){S.weekView=ymd(addDays(parse(S.weekView),7));render();}break;
    case "swprev":S.sw=ymd(addDays(parse(S.sw),-7));render();break;
    case "swnext":if(S.sw<ymd(wkStart(new Date()))){S.sw=ymd(addDays(parse(S.sw),7));render();}break;
    case "togmsg":S.set.weeklyMsg=!S.set.weeklyMsg;queue();render();break;
    case "tv":S.tview=b.getAttribute("data-v");render();break;
    case "jump":var jc=b.getAttribute("data-c");S.coll[jc]=false;render();var je=document.getElementById("sec-"+jc);if(je)je.scrollIntoView({behavior:"smooth"});break;
    case "seen":S.set.seenGuide=true;queue();render();break;
    case "rt":S.rtab=b.getAttribute("data-v");render();break;
    case "rstep":toggleStep(b.getAttribute("data-id"));break;
    case "filt":S.filter=b.getAttribute("data-c");render();break;
    case "fnew":startEdit(null,S.filter);break;
    case "fedit":startEdit(b.getAttribute("data-id"));window.scrollTo(0,0);break;
    case "farc":archive(b.getAttribute("data-id"));break;
    case "frest":restore(b.getAttribute("data-id"));break;
    case "fcat":S.edit.cat=b.getAttribute("data-c");render();break;
    case "fday":var i=+b.getAttribute("data-i"),p=S.edit.days.indexOf(i);if(p>=0)S.edit.days.splice(p,1);else S.edit.days.push(i);render();break;
    case "fall":S.edit.days=ALL.slice();render();break;
    case "fduty":S.edit.days=DUTY.slice();render();break;
    case "fsave":saveEdit();break;
    case "fcancel":S.edit=null;S.editErr="";render();break;
  }
});
document.addEventListener("input",function(ev){
  var f=ev.target.getAttribute&&ev.target.getAttribute("data-f");
  if(f&&S.edit)S.edit[f]=ev.target.value;
});
document.addEventListener("change",function(ev){
  var f=ev.target.getAttribute&&ev.target.getAttribute("data-f");
  if(f&&S.edit)S.edit[f]=ev.target.value;
});
document.addEventListener("toggle",function(ev){
  var el=ev.target;
  if(el&&el.getAttribute&&el.getAttribute("data-sid"))S.ropen[el.getAttribute("data-sid")]=el.open;
},true);
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&S.edit&&ev.target.classList&&ev.target.classList.contains("inp")&&ev.target.tagName!=="TEXTAREA"){ev.preventDefault();saveEdit();}
});

/* ---------- start ---------- */
render();
initDb();
})();

</script>
